# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # D6: corepack first. setup-node's `cache: yarn` shells out to yarn to
      # find the cache folder, so yarn has to exist before it runs. This is the
      # ordering that bit the Servandum CI.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      # setup-node puts a different Node on PATH than the one the first
      # `corepack enable` shimmed, so enable again for the Node we will use.
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck

  smoke:
    name: ses-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      # Bundles every examples/ contract with @endo/bundle-source and evaluates
      # it under lockdown, endowed exactly as SwingSet endows a vat. This is the
      # only job that runs contract code the way a chain does, and it is the
      # seed of Preflight's test suite (plan §1.6).
      - run: yarn smoke

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # D6 as corrected on 2026-09-16: agoric-sdk at agoric-upgrade-23a declares
    # engines ^20.9 || ^22.11, so Node 22 is the leg that has to be green and
    # the only one `main` requires. Node 24 runs for early warning and is
    # allowed to fail; Node 20 is excluded, end of life April 2026.
    continue-on-error: ${{ matrix.node == '24' }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
