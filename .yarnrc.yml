# The node-modules linker, not PnP: SES lockdown, @endo/bundle-source and the
# SES smoke job all resolve real files on disk. agoric-sdk makes the same choice.
nodeLinker: node-modules

# Benchmarked by agoric-sdk; keeps repeated installs cheap.
nmMode: hardlinks-local

# No yarnPath / committed release binary. D6: corepack provisions yarn from the
# `packageManager` field in package.json.
enableGlobalCache: true
